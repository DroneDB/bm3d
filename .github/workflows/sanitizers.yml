#
# The tests under AddressSanitizer, LeakSanitizer and UndefinedBehaviorSanitizer, built with the
# Clang of the runner image. The flags are given here, not in CMakeLists.txt: the project sets no
# compiler flag of its own. The ports come from vcpkg uninstrumented; the project's code and the
# imported sources are instrumented.
#
# No suppressions: any report of the sanitizers is a failure. The undefined behaviour and the leak
# that corto had are fixed by third_party/corto-patches/. The robustness tests run their mutation
# loop with more runs here than in ci.yml, on the instrumented program.
#
# The vcpkg binary cache is the one of the linux-clang job of ci.yml, saved by whichever job gets
# past its configure step first, even when the tests fail afterwards.
name: Sanitizers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must equal "builtin-baseline" in vcpkg.json (ci.yml checks the pair).
  VCPKG_COMMIT: 65514b43a035548911e1789071785a9827470cdc
  VCPKG_DISABLE_METRICS: "1"
  TEST_LABELS: unit|integration|cli|robustness|golden|determinism
  # Runs of the mutation loop of the robustness tests (ci.yml runs fewer)
  BM3D_MUTATION_RUNS: "500"

jobs:
  asan-ubsan:
    name: clang ASan + UBSan
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        # nasm: libjpeg-turbo's port needs it.
        run: sudo apt-get update && sudo apt-get install -y nasm ninja-build pkg-config

      - name: vcpkg at the pinned commit, with the binary cache of linux-clang
        id: vcpkg
        uses: ./.github/actions/vcpkg
        with:
          commit: ${{ env.VCPKG_COMMIT }}
          cache-name: linux-clang

      - name: Configure (optimised a little, with debug information, assertions on)
        id: configure
        run: >
          cmake --preset release
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBM3D_BUILD_TESTS=ON
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined,float-cast-overflow -fno-omit-frame-pointer"
          "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O1 -g"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined,float-cast-overflow"

      - name: Build
        run: cmake --build build --parallel

      - name: Allow the sanitizer runtimes' memory layout
        # The runner kernel randomizes mmap with 32 bits; the sanitizer runtimes expect at most
        # 28 and stop at start-up ("unexpected memory mapping") otherwise.
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build -L "$TEST_LABELS" --no-tests=error --output-on-failure

      - name: Keep the logs of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-sanitizers
          if-no-files-found: ignore
          path: |
            build/vcpkg-manifest-install.log
            build/Testing/Temporary/LastTest.log
            ${{ env.VCPKG_ROOT }}/buildtrees/**/*.log

      # Last, so that it runs after failed tests as well
      - name: Save the vcpkg binary cache
        if: always() && steps.configure.outcome == 'success' && steps.vcpkg.outputs.cache-hit != 'true'
        uses: ./.github/actions/vcpkg-save
        with:
          key: ${{ steps.vcpkg.outputs.cache-primary-key }}
