#
# Builds and tests the viewer (web/): corto.wasm from third_party/corto with the pinned emsdk, the
# bundles with rollup, the tests of the reader and of the decoder in node (vitest), and a render of
# the fixtures in a headless Chromium (Playwright). It runs when the viewer, the format document, the
# builder or its tests change.
#
# The golden job builds the command line (Linux, GCC, the vcpkg binary cache of the linux-gcc job of
# ci.yml) and writes its golden files (tests/golden/); the Python reader (scripts/dump.py) reads them,
# and the web job reads and draws them too, from BM3D_GOLDEN_DIR. So the three readers of the format
# read what the command line of this commit writes.
name: Web

on:
  push:
    paths:
      - "web/**"
      - "docs/FORMAT.md"
      - "src/**"
      - "cli/**"
      - "include/**"
      - "third_party/**"
      - "tests/**"
      - "scripts/dump.py"
      - "scripts/modelfile.py"
      - "scripts/tests/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - ".github/actions/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "docs/FORMAT.md"
      - "src/**"
      - "cli/**"
      - "include/**"
      - "third_party/**"
      - "tests/**"
      - "scripts/dump.py"
      - "scripts/modelfile.py"
      - "scripts/tests/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - ".github/actions/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    name: golden files of the command line
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        # nasm: libjpeg-turbo's port needs it.
        run: sudo apt-get update && sudo apt-get install -y nasm ninja-build pkg-config
      - name: vcpkg at the pinned commit, with the binary cache of linux-gcc
        id: vcpkg
        uses: ./.github/actions/vcpkg
        with:
          cache-name: linux-gcc
      - name: Configure
        id: configure
        run: cmake --preset release -DBM3D_BUILD_TESTS=ON
      - name: The golden files
        env:
          BM3D_GOLDEN_DIR: ${{ runner.temp }}/golden
        run: cmake --build build --parallel --target bm3d_golden_fixtures
      - name: The Python reader reads them
        env:
          BM3D_GOLDEN_DIR: ${{ runner.temp }}/golden
        run: |
          pip install -r scripts/requirements-tools.txt
          python -m unittest discover -s scripts/tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: golden
          path: ${{ runner.temp }}/golden
          if-no-files-found: error

      # Last, so that it runs after a failed build or test as well
      - name: Save the vcpkg binary cache
        if: always() && steps.configure.outcome == 'success'
        uses: ./.github/actions/vcpkg-save
        with:
          key: ${{ steps.vcpkg.outputs.cache-primary-key }}
          cache-hit: ${{ steps.vcpkg.outputs.cache-hit }}

  web:
    name: web
    needs: golden
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BM3D_GOLDEN_DIR: ${{ github.workspace }}/golden
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: golden
          path: ${{ env.BM3D_GOLDEN_DIR }}

      - uses: ./.github/actions/build-corto-wasm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the dependencies
        working-directory: web
        run: npm ci
      - name: Bundles
        working-directory: web
        run: npm run build
      - name: The package holds the bundles, the worker, the wasm file and the licences
        working-directory: web
        run: |
          npm pack --pack-destination "$RUNNER_TEMP" > /dev/null
          listing="$(tar tzf "$RUNNER_TEMP"/bm3d-viewer-*.tgz)"
          for file in dist/bm3d-viewer.js dist/bm3d-viewer.min.js dist/corto-worker.js dist/corto.wasm LICENSE NOTICE README.md; do
            echo "$listing" | grep -qx "package/$file" || { echo "missing from the package: $file"; exit 1; }
          done
      - name: Tests in node (the fixtures and the golden files)
        working-directory: web
        run: npx vitest run
      - name: Drop the Microsoft apt repository of the runner image
        # Playwright's --with-deps runs "apt-get update", which exits with 100 when any configured
        # repository fails to refresh; packages.microsoft.com answered 403 on a run. Nothing here
        # installs from it (Chromium's system libraries all come from Ubuntu), so the update only
        # reads the Ubuntu repositories and no longer depends on a third-party host.
        run: |
          grep -rl 'packages.microsoft.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null \
            | xargs -r sudo rm -v
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Render the fixtures and the golden files in Chromium
        working-directory: web
        run: npm run test:browser
