#
# Builds corto.wasm (the corto decoder of the viewer, web/dist/corto.wasm after the bundles) with
# the emsdk release named in web/corto-wasm/EMSDK_VERSION: the emsdk scripts and the compiler are
# both taken at that tag, and the installation is cached.
name: Build corto.wasm
description: corto.wasm from third_party/corto with the pinned emsdk

runs:
  using: composite
  steps:
    - name: The emsdk version
      id: emsdk
      shell: bash
      run: echo "version=$(tr -d '[:space:]' < web/corto-wasm/EMSDK_VERSION)" >> "$GITHUB_OUTPUT"

    - name: Cache emsdk
      id: emsdk-cache
      uses: actions/cache@v4
      with:
        path: ~/emsdk
        key: emsdk-${{ runner.os }}-${{ steps.emsdk.outputs.version }}

    - name: Install emsdk
      if: steps.emsdk-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git clone --depth 1 --branch "${{ steps.emsdk.outputs.version }}" https://github.com/emscripten-core/emsdk.git ~/emsdk
        ~/emsdk/emsdk install "${{ steps.emsdk.outputs.version }}"

    - name: corto.wasm
      shell: bash
      working-directory: web
      run: |
        ~/emsdk/emsdk activate "${{ steps.emsdk.outputs.version }}"
        source ~/emsdk/emsdk_env.sh
        emcc --version | head -1
        corto-wasm/build.sh
