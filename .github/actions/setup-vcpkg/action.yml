#
# A vcpkg checkout at the commit vcpkg.json pins as its baseline (so that a port is the version
# the reference outputs were built with), bootstrapped, with the binary archives it makes kept in
# the Actions cache. Sets VCPKG_ROOT, VCPKG_DEFAULT_BINARY_CACHE and VCPKG_DISABLE_METRICS for the
# steps that follow. The cache is saved when the job succeeds.
name: Set up vcpkg
description: vcpkg at the baseline of vcpkg.json, bootstrapped, with its binary cache restored

inputs:
  cache-name:
    description: Names the binary cache (for instance the job and the triplet); one cache per name
    required: true

runs:
  using: composite
  steps:
    - name: Paths of the vcpkg checkout and its binary cache, and the baseline
      shell: bash
      run: |
        temp="$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")"
        baseline="$(sed -n 's/.*"builtin-baseline": *"\([0-9a-f]*\)".*/\1/p' vcpkg.json)"
        if [ -z "$baseline" ]; then
          echo "::error::vcpkg.json has no builtin-baseline"
          exit 1
        fi
        {
          echo "VCPKG_ROOT=$temp/vcpkg"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$temp/vcpkg-archives"
          echo "VCPKG_DISABLE_METRICS=1"
          echo "VCPKG_BASELINE=$baseline"
        } >> "$GITHUB_ENV"
        mkdir -p "$temp/vcpkg-archives"

    - name: Restore the vcpkg binary cache
      uses: actions/cache@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-${{ runner.os }}-${{ inputs.cache-name }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ inputs.cache-name }}-

    - name: Fetch vcpkg at the baseline
      shell: bash
      run: |
        git init -q "$VCPKG_ROOT"
        git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
        git -C "$VCPKG_ROOT" fetch -q --depth 1 origin "$VCPKG_BASELINE"
        git -C "$VCPKG_ROOT" checkout -q FETCH_HEAD

    - name: Bootstrap vcpkg (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: $VCPKG_ROOT/bootstrap-vcpkg.sh -disableMetrics

    - name: Bootstrap vcpkg (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics
