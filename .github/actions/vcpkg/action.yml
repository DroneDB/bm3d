#
# vcpkg at the commit the manifest pins as its baseline, with its binary cache restored: the steps
# that ci.yml, sanitizers.yml and web.yml share. It sets VCPKG_ROOT and VCPKG_DEFAULT_BINARY_CACHE
# (under the runner's temporary folder) for the steps after it. The cache is keyed on the runner,
# a name (the job's compiler), the manifest and the commit; the vcpkg-save action saves it.
name: vcpkg
description: vcpkg at a pinned commit, bootstrapped, with its binary cache restored
inputs:
  commit:
    description: the vcpkg commit, "builtin-baseline" of vcpkg.json
    required: true
  cache-name:
    description: the name of the binary cache (the job whose ports it holds)
    required: true
  cache-from:
    description: another name whose cache is restored when this one has none yet
    required: false
    default: ""
outputs:
  cache-hit:
    description: whether the exact cache was restored
    value: ${{ steps.restore.outputs.cache-hit }}
  cache-primary-key:
    description: the key to save the cache under
    value: ${{ steps.restore.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    - name: Paths of the vcpkg checkout and its binary cache
      shell: bash
      run: |
        temp="$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")"
        echo "VCPKG_ROOT=$temp/vcpkg" >> "$GITHUB_ENV"
        echo "VCPKG_DEFAULT_BINARY_CACHE=$temp/vcpkg-archives" >> "$GITHUB_ENV"
        mkdir -p "$temp/vcpkg-archives"

    - name: Restore the vcpkg binary cache
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-${{ runner.os }}-${{ inputs.cache-name }}-${{ hashFiles('vcpkg.json') }}-${{ inputs.commit }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ inputs.cache-name }}-
          vcpkg-${{ runner.os }}-${{ inputs.cache-from || inputs.cache-name }}-

    - name: Set up vcpkg at the pinned commit
      shell: bash
      run: |
        git init -q "$VCPKG_ROOT"
        git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
        git -C "$VCPKG_ROOT" fetch -q --depth 1 origin "${{ inputs.commit }}"
        git -C "$VCPKG_ROOT" checkout -q FETCH_HEAD

    - name: Bootstrap vcpkg (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: $VCPKG_ROOT/bootstrap-vcpkg.sh -disableMetrics

    - name: Bootstrap vcpkg (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics
